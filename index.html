<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volcano City: Cops vs Criminals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles/style.css" />
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <h1>Volcano City: Cops vs Criminals</h1>
      <p class="subtitle">Tasers only. Escapes forever.</p>
    </header>

    <main class="layout">
      <section class="panel" id="world-panel">
        <h2>World Overview</h2>
        <div id="world-summary"></div>
      </section>

      <section class="panel" id="heists-panel">
        <h2>Heists</h2>
        <ul id="heist-list"></ul>
      </section>

      <section class="panel" id="vehicles-panel">
        <h2>Vehicles</h2>
        <ul id="vehicle-list"></ul>
      </section>
    </main>

    <footer class="footer">
      <span>Design by Raymond • Prototype build</span>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
